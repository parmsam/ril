title: "Where all those weird new drinks are coming from: Planet Money"
url: https://www.npr.org/2026/10/02/nx-s1-5989651/flavorman-adaptogens-probiotic-functional-soda-seltzer-drink
description: >-
  A Planet Money episode, hosted by Jeff Guo, that visits the Louisville beverage-development lab Flavorman. It gives three reasons the drink aisle keeps growing: advances in flavor science, new functional ingredients, and much lower barriers to manufacturing.
type: episode
tags: [economics, food, beverages, business, planet-money]
date: 2026-10-02
added: 2026-10-04T11:22
note: >-
  The manufacturing story is the core of the episode. Canning lines used to require a full-truckload minimum of about 12,000 cases. Then the craft-beer boom left thousands of small breweries with spare canning capacity, and falling alcohol consumption has added even more, so upstart brands can now do small test runs. A smaller detail: a stinky-cheese aroma compound turns up in ripe strawberries, and without it a berry flavor tastes flat.
