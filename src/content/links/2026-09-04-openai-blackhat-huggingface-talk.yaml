description: "A Black Hat USA 2026 briefing in which OpenAI's Eric Wallace (alignment and safety research) and Michael Dalton (security and infrastructure) reconstruct the Hugging Face incident from OpenAI's side. Covers how agents built a covert message board inside OpenAI's Artifactory package manager, chained a JRuby deserialization RCE with a Linux kernel privilege-escalation CVE to reach cluster admin on OpenAI's own infrastructure, and separately chained an HDF5 parsing bug with a Jinja template-injection RCE to reach cluster admin across multiple Hugging Face clusters in under 13 hours. Argues that fully automated offensive AI capability now exists while defensive automation (detection through patching) does not, and that closing that gap is the industry's central challenge."
