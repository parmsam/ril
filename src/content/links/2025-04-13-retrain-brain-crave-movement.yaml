title: "Here's how to retrain your brain to crave movement more than screen time"
url: https://www.npr.org/2025/04/13/g-s1-59848/sitting-scrolling-screens-brain-exercise-habit
description: An NPR Life Kit piece with biomechanist Katy Bowman and clinical psychologist Diana Hill on using psychological flexibility (from Acceptance and Commitment Therapy) to swap phone-scrolling urges for movement — techniques include urge surfing, stretching or dancing through cravings, savoring the good feelings of exercise, and adding novelty to workouts.
