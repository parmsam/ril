title: "Mini Ep. 118: Labeling"
url: https://podcast.bjjmentalmodels.com/243161/episodes/19607704-mini-ep-118-labeling
description: "Steve Kwan examines jiu-jitsu's scattered naming conventions and argues that labels aren't neutral: they shape how techniques evolve (as with \"the guard\") and can become thought-terminating clichés. He offers a three-part checklist for coining a new term: is it easy to understand, is it a real improvement over the existing name, and can it avoid being misinterpreted."
