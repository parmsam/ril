title: You bet your life insurance
url: https://www.npr.org/2026/08/14/nx-s1-5885879/life-insurance-settlements
description: "NPR's Planet Money traces how viatical settlements, deals letting AIDS patients sell life insurance policies for cash in the early 1990s, evolved into a multi-billion-dollar Wall Street market where investors buy bundled policies from healthy retirees and bet on aggregate mortality."
