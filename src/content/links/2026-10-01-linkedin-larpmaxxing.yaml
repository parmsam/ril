title: LinkedIn Larpmaxxing
url: https://hereticpleb.vercel.app/blog/linkedin-larpmaxxing/
description: A rant about the flood of near-identical computer vision demo projects on LinkedIn, followed by building a YOLOv8 detector for "excited to announce my YOLO project" posts in about 90 minutes to show how little effort they take.
type: post
tags: [linkedin, computer-vision, social-media, careers]
date: 2026-09-28
added: 2026-10-01T09:35
note: >-
  The author's broader argument is that LinkedIn rewards looking interesting rather than getting better, and that calling out low-effort work is socially costly there because comments show up on your profile, so the same pothole detector gets posted over and over with no visible improvement.
