title: We Should Standardize Vibe-Coding Ethics
url: https://www.bennjordan.com/blog/we-should-standardize-vibe-coding-ethics
description: "Benn Jordan argues that the ethics of AI use matter most once vibe-coded software is sold, where cheap clones can crowd out expert-built tools without buyers knowing the difference. He proposes two rules for vibe-coded software: open source it so it can be supported and debugged, and label it with a standardized self-rating that runs from NoAI through AI-aux, AI-UI, and AI-dev-A/B/C to fully AI-written AI-V."
