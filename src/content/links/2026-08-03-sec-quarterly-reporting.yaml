title: Almost nobody wants this SEC change
url: https://www.axios.com/2026/07/28/sec-quarter-reporting-investors
description: "The SEC's proposal to let companies report financials twice a year instead of quarterly drew a record ~221,000 public comments, with more than 99% opposed — individual investors, institutional investors, former SEC officials, and academics all argued that quarterly 10-Qs are essential to how they price and track companies."
