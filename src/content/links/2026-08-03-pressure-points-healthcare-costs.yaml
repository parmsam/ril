description: "Healthcare Triage (in partnership with AcademyHealth) breaks down why US health care spending, at about 18% of GDP and nearly double many peer countries, keeps rising: not one villain but a stack of higher prices, rising utilization of new treatments added on top of old ones, coverage gaps, administrative overhead, and underfunded chronic-disease prevention."
