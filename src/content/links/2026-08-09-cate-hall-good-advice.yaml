title: The good advice you least want (with Cate Hall)
url: https://podcast.clearerthinking.org/episode/321/cate-hall-the-good-advice-you-least-want/
description: "Spencer Greenberg talks with Cate Hall, author of You Can Just Do Things, about why people gravitate toward self-help that flatters their existing strengths rather than the advice that would challenge them, the Enneagram as a lens on default psychological \"shape,\" and how personal agency comes from noticing degrees of freedom — untested social scripts and low-stakes rejection — that others assume are fixed constraints."
