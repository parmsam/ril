title: TikTok trend of reading while listening to books gains steam
url: https://www.npr.org/2026/05/20/nx-s1-5790811/immersive-reading-trend
description: "NPR reports on \"immersive reading\" — reading a book's text while simultaneously listening to its audiobook — which TikTok search volume shows rising sharply in 2026; cognitive neuroscientist Maryanne Wolf notes it can deepen engagement but doesn't necessarily produce the slower, print-driven cognitive patience of true \"deep reading.\""
