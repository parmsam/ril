description: "Hyundai's unionized workers in South Korea are on a partial strike after the company unveiled its Boston Dynamics-built humanoid robot, Atlas, arguing that humanoids shouldn't join the assembly line without worker sign-off. The Journal (WSJ's podcast, hosted by Ryan Knutson and Jessica Mendoza) covers the first labor showdown over humanoid robots and what it signals for the auto industry."
