title: "Your phone addiction is keeping you from achieving flow state | Arthur Brooks"
url: https://www.youtube.com/watch?v=KHd-luu3M8s
description: "Arthur Brooks (professor at Vanderbilt University, senior fellow at Harvard Business School) argues phone-checking hijacks the same dopamine anticipation-of-reward circuitry as other addictions, and that constant stimulation crowds out the boredom needed to reach Mihaly Csikszentmihalyi's flow state. He lays out a 3-step recovery framework and concrete protocols — tech-free times, tech-free zones, and periodic multi-day tech fasts."
