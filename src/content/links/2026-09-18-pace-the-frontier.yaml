title: "We Must Pace the Frontier"
url: https://darioamodei.com/post/we-must-pace-the-frontier
description: "Anthropic CEO Dario Amodei argues that recursive self-improvement and the OpenAI/Hugging Face hacking incident mean AI companies now need to deliberately slow the pace of capability gains so that alignment, interpretability, and safety testing can keep up. He proposes a three-step 'pacing the frontier' plan: embedded third-party evaluators (which Anthropic is unilaterally adopting), industry-wide democratic coordination on safety standards, and eventual global coordination with authoritarian governments."
