title: "FDA Advisory Committee's Vote May Open A Drug-Compounding Back Door For Unapproved Peptides"
url: https://www.healthaffairs.org/content/forefront/fda-advisory-committee-s-vote-may-open-drug-compounding-back-door-unapproved-peptides
description: "Health Affairs Forefront analysis by Mengyuan Fu, Joseph S. Ross, Ngoc-Trang Adrienne H. Nguyen, and Reshma Ramachandran of the FDA Pharmacy Compounding Advisory Committee's July 2026 vote to add six unapproved peptides (BPC-157, KPV, TB-500, MOTS-c, Epitalon, Semax) to the 503A Bulks List despite FDA scientists finding insufficient evidence of benefit, safety, or manufacturing quality, and documents financial conflicts of interest among the voting committee members."
