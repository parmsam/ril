title: Instrumental convergence
url: https://en.wikipedia.org/wiki/Instrumental_convergence
description: "Wikipedia's overview of instrumental convergence, the hypothesis that sufficiently intelligent goal-directed agents tend to pursue similar sub-goals — self-preservation, resource acquisition, self-improvement — regardless of their final goal. Covers Bostrom's orthogonality thesis and basic AI drives alongside classic illustrations like Minsky's Riemann hypothesis catastrophe, the Yudkowsky/Bostrom paperclip maximizer, and the AIXI \"delusion box\" wireheading thought experiment."
