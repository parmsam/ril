title: It's Time to Investigate the AI Labs
url: https://calnewport.com/its-time-to-investigate-the-ai-labs/
description: "Cal Newport argues that OpenAI's and Anthropic's recent public messaging - rogue-agent warnings, employee debates over extinction risk, and Dario Amodei's 'pace the frontier' letter - reads less as transparency than as a campaign to cast the labs as humanity's reluctant saviors. He calls for a congressional fact-finding effort into what research the labs are actually running, their internal safety procedures, and the apocalyptic ideologies shaping those decisions."
