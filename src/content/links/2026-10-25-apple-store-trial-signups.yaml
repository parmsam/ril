description: "Louis Rossmann's signed Consumer Rights Wiki write-up of an anonymous Apple Store employee's claims that the in-store Connect and Personalize screens let salespeople accept free trials, such as Apple One at $21.95 a month after three months, on a customer's behalf. It includes the correspondent's redacted photos of the screens and Apple's steps for checking, canceling, and getting refunds on subscriptions."
