title: How to practice 'deep reading'
url: https://www.npr.org/2024/04/30/1196979151/how-to-practice-deep-reading
description: An NPR Life Kit episode with cognitive neuroscientist Maryanne Wolf on why deep reading isn't innate to the brain, how screen-driven skimming disrupts it, and practical ways to rebuild the skill — reading print for material that demands attention, practicing in short daily increments, letting pace be set by the reader and the book, and taking notes to aid retention.
