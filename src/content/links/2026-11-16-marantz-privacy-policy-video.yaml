title: Marantz receiver pushes updated privacy policy that covers immigration status w/ no disagree button
url: https://www.youtube.com/watch?v=yjztDQCe9_0
description: >-
  Louis Rossmann reads through the HARMAN privacy notice and Marantz terms that a $2,000 receiver owner was forced to acknowledge, with no decline option, to keep using third-party streaming apps on a device bought before Samsung-owned HARMAN acquired the brand.
type: video
tags: [consumer-rights, privacy, ownership, terms-of-service, audio]
date: 2026-11-16
added: 2026-11-16T20:27
note: >-
  The core complaint is post-sale term changes: an "acknowledge"-only prompt, a privacy notice whose data categories include employment history, tax and immigration information, ad-network and Samsung-group sharing, forced arbitration, and a $100 liability cap. Rossmann contrasts it with his own setup (a Navidrome server and an amp that cannot connect to the internet) and pitches drafted legislation to incoming members of Congress.
