title: "There Is No AI, Really (It's Just People), with Jaron Lanier"
url: https://www.youtube.com/watch?v=TTppvBU2rU4
description: "On StarTalk, computer scientist and VR pioneer Jaron Lanier argues large language models are best understood as a collaboration of people's combined work rather than an autonomous entity, and traces how network effects centralize power online, why VR never found its killer app, and his case for \"data dignity\" — compensating people for the data that trains AI — as an alternative to behavior-prediction-driven business models."
