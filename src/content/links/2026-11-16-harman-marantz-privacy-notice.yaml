title: Harman privacy notice on Marantz receivers
url: https://consumerrights.wiki/w/User:Louis/Harman_privacy_notice_on_Marantz_receivers
description: >-
  A sourced Consumer Rights Wiki analysis of HARMAN's November 2026 privacy notice, which Marantz's updated terms incorporate and which lists workforce data such as immigration, tax, payroll and banking information among what it may collect, alongside ad-network and Samsung-group sharing.
type: article
tags: [consumer-rights, privacy, ownership, terms-of-service, audio]
date: 2026-11-16
added: 2026-11-16T20:28
note: >-
  The broad list stems from HARMAN merging its product-user and employee privacy notices into one document, prefaced by "as applicable"; the April 2025 version only covered employer and job title. The page also notes the 2022 CINEMA 50 manual promised Marantz would "never provide any information we collect to third parties," and cites Sonos's 2017 accept-or-lose-functionality policy as precedent.
