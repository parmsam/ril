title: Anthony Bourdain on Writing, Food, Adventure, and Finding a Calling
url: https://www.mensjournal.com/food/anthony-bourdains-life-advice-20140919
description: A 2014 Men's Journal Q&A in which Anthony Bourdain gives life advice on punctuality, saying no, critics, regret, vanity, hedonism, and finding a calling.
type: article
tags: [anthony-bourdain, life-advice, interview, food, work, discipline]
date: 2014-09-19
added: 2026-10-24T15:41
note: >-
  The best advice he received was to show up on time: under his mentor, arriving even two minutes short of 15 minutes early cost a shift, and he called punctuality "the basis of everything." He frames his life as "a series of stratagems" to outwit his inner lazy hedonist, and never drinks at home. Other threads include saying no to a lucrative franchise to keep "assholes" out of his life, a tattoo reading "I am certain of nothing," and the claim that everyone should be able to cook an omelet, roast a chicken, and make a proper pasta pomodoro.
