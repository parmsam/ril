title: How should armies fight?
url: https://worksinprogress.co/issue/the-future-of-war/
description: >-
  Pieter Garicano reviews Jack Watling's The Arms of the Future, which argues that the reach of sensors, the range of weapons, and the precision of munitions have made concentration and surprise nearly impossible on the modern battlefield. The war in Ukraine has since evolved largely along the lines the book predicted.
type: article
tags: [war, military, ukraine, technology, books]
date: 2026-11-08
added: 2026-11-16T12:00
note: >-
  Heavy artillery firing at 16 km eighty years ago missed by about fifty meters; today at 70 km it misses by about two. Armies are left with three options: disperse and dig in, retreat into cities, or fight the enemy's sensors to open a brief window for a concentrated attack. Watling favors the third, and units like Ukraine's Third Assault Brigade are already trying it, though it only works as long as they can keep blinding the enemy.
