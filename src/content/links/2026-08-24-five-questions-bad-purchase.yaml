title: 5 questions that can save you from a bad purchase
url: https://www.npr.org/2026/08/24/nx-s1-5940641/5-questions-that-can-save-you-from-a-bad-purchase
description: "NPR's Life Kit lays out a six-step framework for resisting retailer pressure and impulse buys: distinguish needs from wants, check in on the emotion driving the purchase, weigh whether the item fits your lifestyle and upkeep, research quality and durability, set a spending ceiling, and be willing to just walk away."
