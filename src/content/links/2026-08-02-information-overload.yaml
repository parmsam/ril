title: Free yourself from 'information overload'
url: https://www.npr.org/transcripts/nx-s1-5909599
description: "NPR's Life Kit talks with Manoush Zomorodi (TED Radio Hour host, author of Body Electric) about infomania: how to spot information overload (eye twitching, poor concentration, self-interruption), set information goals instead of aimless browsing, time-box to minimize task-switching, and use short walks to restore glucose-depleted focus."
