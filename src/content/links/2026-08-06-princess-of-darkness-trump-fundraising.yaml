title: The 'Princess of Darkness' Raising Millions for Trump
url: https://www.wsj.com/podcasts/the-journal/the-princess-of-darkness-raising-millions-for-trump/2892aff7-3a2f-4b12-8b95-7bbc54f75f7c
description: "The Journal (WSJ's podcast, hosted by Ryan Knutson and Jessica Mendoza) unpacks WSJ reporting finding Trump and allies have raised over $800 million since his second inauguration, funding projects like a White House ballroom, his presidential library, and a 50th-anniversary celebration. The episode profiles fundraiser Meredith O'Rourke, nicknamed the 'Princess of Darkness,' and the corporate donors — including Meta, Apple, Microsoft, Amazon, and Lockheed Martin — writing checks."
