description: "Dave Smith and Jameson Dance field two listener questions: managing a CTO who vibe-codes unreviewed projects and dumps the cleanup work on the engineering team, and coping with 7:30pm cross-timezone meetings that collide with an early kindergarten-drop-off routine. Advice centers on naming the externalities the CTO creates and escalating through the EM, and on pushing to reschedule meetings earlier rather than absorbing the fatigue indefinitely."
