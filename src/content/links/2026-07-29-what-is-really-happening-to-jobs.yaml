title: "What is really happening to jobs? Separating AI hype from reality"
url: https://siepr.stanford.edu/publications/policy-brief/what-really-happening-jobs-separating-ai-hype-reality
description: "Stanford Institute for Economic Policy Research policy brief synthesizing recent labor-economics research on AI's effect on jobs: aggregate employment impact looks small so far, entry-level hiring in exposed occupations has weakened since 2022, productivity effects are positive but uneven, and firm adoption is accelerating unevenly across sectors."
