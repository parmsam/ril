title: "How the Elizabeth Holmes Doc 'You Can See Everything' Is Deceiving You"
url: https://www.readtheprofile.com/p/elizabeth-holmes-documentary-you-can-see-everything
description: Polina Pompliano argues that the new Elizabeth Holmes documentary, directed by Lance Oppenheim and Nathan Fielder, is less about whether Holmes is a liar than a demonstration of how easily viewers' judgments are manipulated by framing, editing, and the order of reveals.
type: post
tags: [documentary, storytelling, psychology, persuasion, theranos]
date: 2026-10-16
added: 2026-10-18T12:11
note: >-
  The piece ties the film to Canon's 2015 experiment in which six photographers shot the same man after being told different stories about him (millionaire, convict, psychic, and so on) and produced wildly different portraits. It also notes a detail often lost in the retelling: Holmes was acquitted on all four patient-fraud charges and convicted for misleading investors. The broader claim is that people form an emotional impression first and then go looking for facts to support it.
