title: 911 calls answered by AI in New Orleans
url: https://www.youtube.com/watch?v=psllRvOotwI
description: "Louis Rossmann argues coverage of New Orleans routing some 911 calls to AI omits key context: the AI only engages when no human is free, the caller is within ~200m of an already-reported crash, and the caller confirms they have nothing new to add. He argues the real story is that even the highest-paying 911 call-taker district in the country can't fill open positions. Source: https://consumerrights.wiki/w/User:Louis/New_Orleans_AI_911_call_triage"
type: video
