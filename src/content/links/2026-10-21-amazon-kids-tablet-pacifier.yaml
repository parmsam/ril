title: Amazon's "digital pacifier" for toddlers
url: https://oligarchwatch.substack.com/p/amazons-digital-pacifier-for-toddlers
description: >-
  Caleb Ecarma looks at Amazon's new Kids Tablets, marketed for children as young as 3, and compares the marketing with pediatric research on screen use. Pediatrician Jenny Radesky criticizes the carry-anywhere handle, the solo-use imagery, and the generative AI story and art features. The piece cites studies linking the use of devices to calm kids with worse emotional regulation, along with Amazon's 2023 FTC settlement over Alexa recordings of children.
